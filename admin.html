<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin | 24CARCARE</title><link rel="stylesheet" href="/app.css">
<style>body{background:var(--lt)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{padding:10px 18px;border-radius:99px;border:1.5px solid #cfd3d8;background:#fff;font:700 .85rem var(--font);cursor:pointer}.tabs button.on{background:var(--bg);color:var(--lime)}table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:.88rem}.t th,.t td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.t th{background:#fafafa}.st{padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:800;background:#eee}.st.confirmed{background:var(--lime)}.st.cancelled{background:#fbd5d1}.card{margin:14px 0}.x{overflow-x:auto}select,input,textarea{padding:8px}.btn.sm{padding:6px 12px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}</style></head><body>
<header class="nav"><div class="wrap navin"><span class="logo"><b>24</b>CARCARE · Admin</span><button class="btn sm ghost" id="lo" style="margin-left:auto;color:#fff" hidden>SIGN OUT</button></div></header>
<main class="wrap" id="app" style="padding:24px 0 80px"></main>
<script>
const $=(s,r=document)=>r.querySelector(s),app=$('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,b)=>{const r=await fetch('/api/admin/'+p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.status===401){login();throw 0}const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j};
let D,tab='bookings';const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function login(){$('#lo').hidden=true;app.innerHTML=`<form class="form card" id="lf" style="max-width:380px;margin:60px auto"><h2>Admin sign in</h2><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><p class="err" id="le"></p><button class="btn">SIGN IN</button></form>`;$('#lf').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(r.ok)load();else $('#le').textContent=(await r.json()).error}}
async function load(){try{D=await api('data')}catch{return}$('#lo').hidden=false;draw()}
$('#lo').onclick=async()=>{await api('logout',{});login()};
function draw(){app.innerHTML=`<div class="tabs">${[['bookings','Bookings'],['week','Week view'],['avail','Availability'],['pricing','Pricing & packages'],['content','Website content'],['gallery','Before & After'],['acct','Account & email']].map(([k,t])=>`<button data-t="${k}" class="${k===tab?'on':''}">${t}</button>`).join('')}</div><div id="v"></div>`;app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});({bookings,week,avail,pricing,content,gallery,acct})[tab]($('#v'))}
const msg=(t)=>alert(t);const act=async(f)=>{try{await f();await load()}catch(e){if(e)msg(e.message)}};
function bookings(v){let f=localStorage.bf||'upcoming';const rows=()=>D.bookings.filter(b=>f==='all'||(f==='upcoming'?b.date>=D.today&&b.status!=='cancelled':b.status===f));
v.innerHTML=`<select id="f">${['upcoming','all','pending','confirmed','completed','cancelled'].map(x=>`<option ${x===f?'selected':''}>${x}</option>`).join('')}</select><div class="x"><table class="t"><tr><th>Ref</th><th>When</th><th>Customer</th><th>Vehicle</th><th>Service</th><th>Status</th><th></th></tr>${rows().map(b=>`<tr><td>${esc(b.ref)}</td><td>${esc(b.date)}<br>${esc(b.time)}</td><td>${esc(b.name)}<br>${esc(b.phone)}<br>${esc(b.email)}<br>${esc(b.address)}, ${esc(b.postcode)}${b.notes?'<br><i>'+esc(b.notes)+'</i>':''}</td><td>${esc(b.reg)}<br>${esc(b.vehicle)} ${esc(b.colour)}<br>${esc(b.size)}</td><td>${esc(b.service)}<br><b>${esc(b.price)}</b><br>${esc(b.pay)} in person</td><td><span class="st ${esc(b.status)}">${esc(b.status)}</span></td><td><select data-id="${b.id}" data-a="s">${['pending','confirmed','completed','cancelled'].map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select><br><button class="btn sm ghost" data-id="${b.id}" data-a="r">Reschedule</button></td></tr>`).join('')||'<tr><td colspan="7">No bookings.</td></tr>'}</table></div>`;
$('#f',v).onchange=e=>{localStorage.bf=e.target.value;bookings(v)};v.querySelectorAll('[data-a=s]').forEach(s=>s.onchange=()=>act(()=>api('status',{id:+s.dataset.id,status:s.value})));v.querySelectorAll('[data-a=r]').forEach(b=>b.onclick=()=>{const d=prompt('New date (YYYY-MM-DD)');if(!d)return;const t=prompt('New start time (HH:MM, 24h)');if(t)act(()=>api('reschedule',{id:+b.dataset.id,date:d,time:t}))})}
function week(v){const base=new Date(D.today+'T12:00:00Z');const days=[...Array(7)].map((_,i)=>{const d=new Date(base);d.setUTCDate(d.getUTCDate()+i);return d.toISOString().slice(0,10)});
v.innerHTML=`<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${days.map(d=>`<div class="card"><b>${new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}</b>${D.blocks.filter(b=>b.date===d).map(b=>`<p class="warn small">Blocked ${b.start_min==null?'all day':'part day'}</p>`).join('')}${D.bookings.filter(b=>b.date===d&&b.status!=='cancelled').map(b=>`<p class="small"><b>${esc(b.time)}</b> ${esc(b.service)}<br>${esc(b.name)}</p>`).join('')||'<p class="mut small">Free</p>'}</div>`).join('')}</div>`}
function avail(v){const S=D.settings,h=S.hours;v.innerHTML=`<div class="card"><h3>Operating hours &amp; scheduling</h3>${[1,2,3,4,5,6,0].map(d=>`<div class="g" style="margin:6px 0;align-items:center"><b>${DAYS[d]}</b><input type="time" data-h="${d}.open" value="${h[d].open}"><input type="time" data-h="${d}.close" value="${h[d].close}"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" data-h="${d}.closed" ${h[d].closed?'checked':''}>Closed</label></div>`).join('')}<div class="g" style="margin-top:12px"><label>Slot interval (mins)<input id="iv" type="number" min="5" step="5" value="${S.interval}"></label><label>Travel/prep buffer (mins)<input id="bf" type="number" min="0" step="5" value="${S.buffer}"></label><label>Capacity (jobs at once)<input id="cp" type="number" min="1" value="${S.capacity}"></label></div><button class="btn sm" id="sv" style="margin-top:12px">SAVE</button></div>
<div class="card"><h3>Block dates / time slots</h3><div class="g"><label>Date<input type="date" id="bd" min="${D.today}"></label><label>Days<input type="number" id="bn" value="1" min="1" max="60"></label><label>From (blank = all day)<input type="time" id="bfr"></label><label>To<input type="time" id="bto"></label><label>Reason<input id="br"></label></div><button class="btn sm" id="bb" style="margin-top:10px">BLOCK</button><table class="t" style="margin-top:12px">${D.blocks.map(b=>`<tr><td>${esc(b.date)}</td><td>${b.start_min==null?'All day':Math.floor(b.start_min/60)+':'+String(b.start_min%60).padStart(2,'0')+'–'+Math.floor(b.end_min/60)+':'+String(b.end_min%60).padStart(2,'0')}</td><td>${esc(b.reason)}</td><td><button class="btn sm ghost" data-u="${b.id}">Remove</button></td></tr>`).join('')}</table></div>`;
$('#sv').onclick=()=>{const nh=JSON.parse(JSON.stringify(h));v.querySelectorAll('[data-h]').forEach(i=>{const[d,k]=i.dataset.h.split('.');nh[d][k]=k==='closed'?i.checked:i.value});act(()=>api('settings',{hours:nh,interval:+$('#iv').value,buffer:+$('#bf').value,capacity:+$('#cp').value}))};
$('#bb').onclick=()=>{const fr=$('#bfr').value,to=$('#bto').value;if((fr&&!to)||(!fr&&to))return msg('Enter both From and To, or neither for a full day.');act(()=>api('block',{date:$('#bd').value,days:+$('#bn').value,from:fr,to:to,reason:$('#br').value}))};v.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>act(()=>api('unblock',{id:+b.dataset.u})))}
function pricing(v){const S=D.settings,P=S.packages;v.innerHTML=`<div class="card"><h3>Base (small) prices &amp; size uplift</h3><div class="g">${['quick','valet','full'].map(k=>`<label>${P[k].name} £<input data-b="${k}" type="number" step="0.01" value="${S.base[k]}"></label>`).join('')}<label>Medium +%<input data-p="medium" type="number" step="0.1" value="${S.pct.medium}"></label><label>Large +%<input data-p="large" type="number" step="0.1" value="${S.pct.large}"></label></div><p class="small mut">Customer prices: ${['small','medium','large'].map(z=>z+' '+['quick','valet','full'].map(k=>'£'+(D.prices[z][k]/100).toFixed(2)).join(' / ')).join(' · ')}</p></div>
${['quick','valet','full'].map(k=>`<div class="card"><h3>${esc(P[k].name)}</h3><label>Name<input data-k="${k}.name" value="${esc(P[k].name)}"></label><label>Description<textarea data-k="${k}.desc" rows="2">${esc(P[k].desc)}</textarea></label><label>Included (one per line)<textarea data-k="${k}.includes" rows="6">${esc(P[k].includes.join('\n'))}</textarea></label><div class="g"><label>Displayed duration text (blank = hidden)<input data-k="${k}.duration" value="${esc(P[k].duration)}"></label><label>Calendar time blocked (mins)<input type="number" min="5" data-k="${k}.blockMin" value="${P[k].blockMin}"></label><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" data-k="${k}.popular" ${P[k].popular?'checked':''}>Mark "Most popular"</label></div></div>`).join('')}<p class="warn small">"Calendar time blocked" is the estimated job length used to reserve time (Quick Wash 30, Full Valet 120, Full Service 210 minutes). Changing it affects new bookings only.</p><button class="btn" id="sv">SAVE PRICING</button>`;
$('#sv').onclick=()=>{const base={},pct={small:0},pk=JSON.parse(JSON.stringify(P));v.querySelectorAll('[data-b]').forEach(i=>base[i.dataset.b]=+i.value);v.querySelectorAll('[data-p]').forEach(i=>pct[i.dataset.p]=+i.value);v.querySelectorAll('[data-k]').forEach(i=>{const[k,f]=i.dataset.k.split('.');pk[k][f]=f==='includes'?i.value.split('\n').map(x=>x.trim()).filter(Boolean):f==='popular'?i.checked:f==='blockMin'?+i.value:i.value});act(()=>api('settings',{base,pct,packages:pk}))}}
function content(v){const S=D.settings,c=S.contact;v.innerHTML=`<div class="card"><h3>Contact details</h3><div class="g">${[['phone','Phone'],['email','Public email'],['notifyEmail','Booking notifications to'],['facebook','Facebook URL'],['instagram','Instagram URL']].map(([k,l])=>`<label>${l}<input data-c="${k}" value="${esc(c[k])}"></label>`).join('')}</div></div><div class="card"><h3>Service areas</h3><p class="small mut">Only list areas you have approved. One per line.</p><textarea id="ar" rows="6" style="width:100%">${esc(S.areas.join('\n'))}</textarea></div><div class="card"><h3>Business description</h3><textarea id="ab" rows="4" style="width:100%">${esc(S.about)}</textarea></div><div class="card"><h3>Homepage hero photo</h3><input type="file" id="hf" accept="image/png,image/jpeg,image/webp"> <button class="btn sm" id="hb">UPLOAD</button></div><button class="btn" id="sv">SAVE</button>`;
$('#sv').onclick=()=>{const contact={...c};v.querySelectorAll('[data-c]').forEach(i=>contact[i.dataset.c]=i.value.trim());act(()=>api('settings',{contact,areas:$('#ar').value.split('\n').map(x=>x.trim()).filter(Boolean),about:$('#ab').value}))};$('#hb').onclick=async()=>{const f=$('#hf').files[0];if(f)act(async()=>api('hero',{image:await rd(f)}))}}
const rd=f=>new Promise((ok,no)=>{if(f.size>5e6)return no(new Error('Max 5MB per image'));const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
function gallery(v){v.innerHTML=`<div class="card"><h3>Add a Before &amp; After pair</h3><p class="small mut">Use the SAME vehicle, same angle, same framing for both photos.</p><label>Title<input id="gt" placeholder="e.g. Ford Focus – interior"></label><div class="g"><label>Before<input type="file" id="gb" accept="image/png,image/jpeg,image/webp"></label><label>After<input type="file" id="ga" accept="image/png,image/jpeg,image/webp"></label></div><button class="btn sm" id="gs" style="margin-top:10px">UPLOAD PAIR</button></div><div class="g">${D.photos.map(p=>`<div class="card"><img src="/uploads/${esc(p.b)}" width="100%" alt=""><img src="/uploads/${esc(p.a)}" width="100%" alt=""><p>${esc(p.title)}</p><button class="btn sm ghost" data-d="${p.id}">Delete</button></div>`).join('')}</div>`;
$('#gs').onclick=()=>{const b=$('#gb').files[0],a=$('#ga').files[0];if(!b||!a)return msg('Choose both a before and an after photo.');act(async()=>api('photo',{title:$('#gt').value,before:await rd(b),after:await rd(a)}))};v.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>confirm('Delete this pair?')&&act(()=>api('photo-delete',{id:+b.dataset.d})))}
function acct(v){v.innerHTML=`<div class="card"><h3>Email delivery</h3><p>${D.mailConfigured?'<span class="ok">Email provider configured.</span>':'<b style="color:#b3261e">Email is NOT configured.</b> Booking emails are recorded below but not sent. Set RESEND_API_KEY and MAIL_FROM (see README).'}</p><table class="t">${D.outbox.map(o=>`<tr><td>${esc(o.created)}</td><td>${esc(o.to_addr)}</td><td>${esc(o.subject)}</td><td>${esc(o.status)}</td></tr>`).join('')}</table></div><div class="card"><h3>Change password</h3><input type="password" id="np" placeholder="New password (10+ chars)" autocomplete="new-password"> <button class="btn sm" id="pb">UPDATE</button></div>`;$('#pb').onclick=()=>act(async()=>{await api('password',{password:$('#np').value});msg('Password updated.')})}
load();
</script></body></html>
